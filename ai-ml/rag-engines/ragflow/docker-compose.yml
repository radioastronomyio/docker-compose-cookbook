# RAGFlow - Deep Document Understanding RAG
# https://ragflow.io/

services:
  ragflow:
    image: infiniflow/ragflow:v0.23.1
    container_name: ragflow-server
    restart: unless-stopped
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${RAGFLOW_PORT:-9380}:9380"
      - "${RAGFLOW_HTTP_PORT:-80}:80"
      - "${RAGFLOW_HTTPS_PORT:-443}:443"
    volumes:
      - ragflow-logs:/ragflow/logs
      - ragflow-nginx:/ragflow/nginx
    environment:
      - TZ=${TZ:-America/New_York}
      - HF_ENDPOINT=https://huggingface.co
      - MACOS=0
      - RAGFLOW_IMAGE=infiniflow/ragflow:v0.23.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ragflow-es
    environment:
      - node.name=es01
      - cluster.name=ragflow-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 10s
      retries: 5

  mysql:
    image: mysql:8.0.36
    container_name: ragflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: rag_flow
    command: --max_connections=1000 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2023-12-20T01-00-02Z
    container_name: ragflow-minio
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ragflow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7.2.4
    container_name: ragflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  esdata01:
  mysql_data:
  minio_data:
  redis_data:
  ragflow-logs:
  ragflow-nginx:

networks:
  default:
    name: ragflow_network
