# ChangeDetection.io - Website Change Monitor
# https://github.com/dgtlmoon/changedetection.io

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "${CHANGEDETECTION_PORT:-5000}:5000"
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - changedetection-data:/datastore
    depends_on:
      - playwright-chrome

  playwright-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: changedetection-browser
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - MAX_CONCURRENT_CHROME_PROCESSES=${MAX_BROWSERS:-4}

volumes:
  changedetection-data:

networks:
  default:
    name: changedetection_network
