services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr_config:/config
      - /mnt/storage:/data  # Unified mount for Atomic Moves
    ports:
      - "7878:7878"
