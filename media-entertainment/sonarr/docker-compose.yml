services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarr_config:/config
      - /mnt/storage:/data  # Unified mount for Atomic Moves
    ports:
      - "8989:8989"
