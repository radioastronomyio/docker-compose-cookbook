services:
  firefly_iii:
    image: fireflyiii/core:latest
    container_name: firefly_iii
    restart: always
    environment:
      - APP_KEY=${APP_KEY}
      - DB_HOST=firefly_db
      - DB_PORT=3306
      - DB_CONNECTION=mysql
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${DB_PASS}
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    ports:
      - "8092:8080"
    depends_on:
      - firefly_db

  firefly_db:
    image: mariadb:10.10
    container_name: firefly_db
    restart: always
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=firefly
    volumes:
      - firefly_db_data:/var/lib/mysql

volumes:
  firefly_upload:
  firefly_db_data:
