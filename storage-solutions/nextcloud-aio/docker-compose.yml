# Nextcloud All-in-One - Sovereign Cloud Storage
# https://github.com/nextcloud/all-in-one

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    ports:
      # AIO Dashboard
      - "${AIO_PORT:-8080}:8080"
    environment:
      # For reverse proxy setups
      - APACHE_PORT=${APACHE_PORT:-11000}
      - APACHE_IP_BINDING=${APACHE_IP_BINDING:-0.0.0.0}
      # Upload and memory limits
      - NEXTCLOUD_UPLOAD_LIMIT=${UPLOAD_LIMIT:-10G}
      - NEXTCLOUD_MEMORY_LIMIT=${MEMORY_LIMIT:-1024M}
      # Timezone
      - TZ=${TZ:-America/New_York}
    volumes:
      # CRITICAL: Mastercontainer config - contains backup encryption keys
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      # Docker socket for spawning sibling containers
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks:
  default:
    name: nextcloud-aio
